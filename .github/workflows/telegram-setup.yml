name: Telegram setup
on:
  push:
    paths:
      - 'orchestrator/tools/configure-telegram.py'
      - 'orchestrator/tools/test-telegram-setup.py'
      - '.github/workflows/telegram-setup.yml'
  pull_request:
    paths:
      - 'orchestrator/tools/configure-telegram.py'
      - 'orchestrator/tools/test-telegram-setup.py'
      - '.github/workflows/telegram-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test setup without Telegram credentials or network calls
        run: python -X utf8 orchestrator/tools/test-telegram-setup.py
