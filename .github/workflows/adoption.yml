name: Test Kanban adoption

on: [push, pull_request]

jobs:
  adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 tools/board.py validate
      - run: python3 -B -m unittest discover -s tests
