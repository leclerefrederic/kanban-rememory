name: Test Kanban board

on: [push, pull_request]

jobs:
  adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 tools/manage-kanban-board.py validate
      - run: python3 -B tools/test-kanban-board.py
